# Windows build of the official team patches (the team release is macOS only),
# published as the `team-cal-preview` release of this fork together with the
# one-line install scripts. macOS users get the official team build from
# preview/install.sh; there is no macOS build here.

name: Team calendar preview

on:
  push:
    branches: [team-cal-preview]
    paths:
      - "team-patches/**"
      - "preview/**"
      - ".github/workflows/team-cal-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: team-cal-preview
  cancel-in-progress: true

env:
  UPSTREAM_REPO: block/buzz
  UPSTREAM_TAG: desktop-v0.5.28
  VERSION: 0.5.28-team.12
  UPDATER_ENDPOINT: https://github.com/EugeneBot01/buzz/releases/download/team-latest/latest.json
  # Public key of the team updater (from the installed team app; public data).
  UPDATER_PUBLIC_KEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEFBM0Q0Qzc2Mzk5QjUyMTQKUldRVVVwczVka3c5cWxjdWRCb05vRTZ3ZFVtOHlHZHJqV2RsNnJYOXlSZHFZWTFCSGdyUHRsZlMK

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      # Patches are LF; check the sources out as LF too or they do not apply.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_TAG }}
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          path: team
          persist-credentials: false

      - name: Apply team patches
        shell: bash
        run: |
          set -euo pipefail
          for p in $(printf '%s\n' team/team-patches/*.patch | sort -V); do
            echo "Applying $(basename "$p")"
            git apply --3way "$p"
          done

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install desktop dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Patch version
        shell: bash
        run: |
          cd desktop && node scripts/set-version-from-tag.mjs "$VERSION"
          cd src-tauri && cargo update --workspace

      - name: Generate release config (team updater)
        shell: bash
        env:
          BUZZ_UPDATER_PUBLIC_KEY: ${{ env.UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: |
          set -euo pipefail
          cd desktop
          node scripts/build-release-config.mjs
          node -e '
            const fs = require("node:fs");
            const f = "src-tauri/tauri.release.conf.json";
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2) + "\n");
          '

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build NSIS installer
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          # build.rs compiles the updater in only when these are set here too.
          BUZZ_UPDATER_PUBLIC_KEY: ${{ env.UPDATER_PUBLIC_KEY }}
          BUZZ_UPDATER_ENDPOINT: ${{ env.UPDATER_ENDPOINT }}
        run: cd desktop && pnpm tauri build --verbose --target "$TARGET" --bundles nsis --config src-tauri/tauri.release.conf.json

      - name: Collect installer
        shell: bash
        run: |
          set -euo pipefail
          EXE=$(find "desktop/src-tauri/target/$TARGET/release/bundle/nsis" -name '*.exe' -type f | head -1)
          [[ -n "$EXE" ]] || { echo "::error::no installer"; exit 1; }
          mkdir -p out
          cp "$EXE" out/Buzz-windows-x64-setup.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/*.exe
          if-no-files-found: error

  publish:
    name: Publish preview release
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cp preview/install.sh preview/install.ps1 dist/
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=team-cal-preview
          NOTES="Buzz 팀 빌드 ${VERSION} 설치. macOS는 install.sh가 공식 팀 빌드를 받고, Windows는 이 릴리스의 설치 파일을 씁니다. 설치 방법은 preview/README.md 참고."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --title "Buzz 팀 빌드 설치 ${VERSION}" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Buzz 팀 빌드 설치 ${VERSION}" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          fi
